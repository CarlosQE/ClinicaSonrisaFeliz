# Integración continua: en cada push a main y en cada Pull Request compila el proyecto.
# (Las pruebas automáticas se agregarán más adelante.)
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compilar:
    name: Compilar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore ClinicaDental.sln

      - name: Compilar
        run: dotnet build ClinicaDental.sln --no-restore -c Release
